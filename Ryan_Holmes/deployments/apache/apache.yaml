apiVersion: v1
kind: Service
metadata:
  name: apache-svc
  namespace: scaling
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.1.245
  labels:
    app: apache
spec:
  type: LoadBalancer
  ports:
  - port: 1010
    targetPort: 80
  selector:
    app: apache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
  namespace: scaling
  labels:
    app: apache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: '/metrics'
        prometheus.io/port: '9117'
    spec:
      # Removed the nodeSelector to allow scheduling on any available node
      containers:
      - name: apache
        image: mreecedobson/apache_httpd:v2-release
        resources:
          requests:
            memory: 16Mi
            cpu: 8m
          limits:
            memory: 32Mi
            cpu: 16m
        ports:
        - containerPort: 80
      - name: apache-exporter
        image: 'lusotycoon/apache-exporter:latest'
        resources:
          limits:
            memory: 128Mi
            cpu: 500m
        ports:
          - containerPort: 9117
